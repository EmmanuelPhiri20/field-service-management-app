plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id("com.google.gms.google-services")
}

android {
    namespace = "com.example.fsm_app"
    compileSdkVersion 34 // Explicitly specify compileSdkVersion
    ndkVersion "23.1.7779620" // You can find this in your SDK Manager if necessary

    defaultConfig {
        applicationId = "com.example.fsm_app"
        minSdkVersion 23 // Update to match Firebase requirements
        targetSdkVersion 33 // Target the latest version or match your desired version
        versionCode 1
        versionName "1.0"

        // Other configurations if needed
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // Use the correct signing configuration for your release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

flutter {
    source = "../.." // Flutter project location
}

dependencies {
    // Import the Firebase BoM (Bill of Materials)
    implementation(platform("com.google.firebase:firebase-bom:33.3.0"))

    // Add Firebase Analytics
    implementation("com.google.firebase:firebase-analytics")

    // Add Firebase Authentication if needed
    implementation("com.google.firebase:firebase-auth")

    // Add other Firebase libraries if necessary
    // e.g., Firebase Firestore, Firebase Messaging, etc.
}